name = "multisig-monitor"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# Every `wrangler deploy` (including Cloudflare Workers Builds on push) resets
# plain-text vars to the values below, so change them here, not in the dashboard.
[vars]
# All instruction types except transaction-buffer and account-cleanup housekeeping
# (transaction_buffer_create/extend/close, *_accounts_close, vault_batch_transaction_account_close).
INSTRUCTION_TYPES = "multisig_create,multisig_create_v2,proposal_create,proposal_activate,proposal_approve,proposal_reject,proposal_cancel,proposal_cancel_v2,vault_transaction_create,vault_transaction_create_from_buffer,config_transaction_create,vault_transaction_execute,config_transaction_execute,multisig_add_member,multisig_remove_member,multisig_change_threshold,multisig_set_time_lock,multisig_set_config_authority,multisig_set_rent_collector,multisig_add_spending_limit,multisig_remove_spending_limit,spending_limit_use,batch_create,batch_add_transaction,batch_execute_transaction"
CONFIG_TYPES = ""
SHOW_PERMISSIONS = "true"
SHOW_TIMESTAMPS = "true"
TRUNCATE_ADDRESSES = "false"
LOG_LEVEL = "info"

# Secrets (set in the dashboard under Settings > Variables and Secrets, or via
# `wrangler secret put`). Do not also define these under [vars]: Cloudflare
# rejects a secret whose name is already used by a var.
# MULTISIG_ADDRESSES  - kept out of this public repo
# HELIUS_AUTH_TOKEN
# SLACK_WEBHOOK_URL
# MULTISIG_ROUTES     - optional; contains Slack webhook URLs
